    <a href="courses.html" data-nav="courses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>Courses</a>

</div></header>

<div class="wrap" id="page">
  <p><a href="courses.html">← All courses</a></p>
  <div id="levelHead"></div>
  <div class="layout">
    <div class="layout-main" id="unitList"></div>
    <aside class="sidebar" id="levelSide"></aside>
  </div>
</div>

<footer class="site"><p class="small muted">Everyday English · everydayenglish.app</p></footer>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var key = params.get('level') || 'a1';
  var data = window.EE_DATA;
  var lv = data.levels[key];
  var page = document.getElementById('page');
  if (!lv) { page.innerHTML = '<h1>Level not found</h1><p><a href="courses.html">Back to courses</a></p>'; return; }
  document.title = lv.name + ' — Everyday English';
  document.documentElement.style.setProperty('--level', lv.color);

  var units = data.units[key] || [];
  var total = lv.days;
  var vc = EE.visitedCount(key, total);
  var pct = total ? Math.round(100 * vc.done / total) : 0;
  var darkOnLight = key === 'a2'; /* yellow header needs dark text / dark ring */
  document.getElementById('levelHead').innerHTML =
    '<section class="lesson-head" data-level="' + key + '" style="--level:' + lv.color + '">' +
    '<div class="top" style="display:flex;gap:16px;align-items:center">' +
    '<span class="ring" style="color:' + (darkOnLight ? '#3D2314' : '#fff') + '">' + EE.ring(vc.done, vc.total, lv.color, 84) + '</span>' +
    '<div><span class="pill level" data-level="' + key + '">' + lv.status.replace('-', ' ') + '</span>' +
    '<h1 style="margin:.2em 0">' + lv.name + '</h1>' +
    '<p style="color:' + (darkOnLight ? 'rgba(61,35,20,.85)' : 'rgba(255,255,255,.92)') + '">' + EE.esc(lv.note) + '<br>' + total + ' days · ' + units.length +
    ' units · ' + vc.done + ' visited · ' + pct + '% done</p></div></div>' +
    '<div class="progress" style="height:10px;border-radius:999px;background:' + (darkOnLight ? 'rgba(61,35,20,.18)' : 'rgba(255,255,255,.3)') + ';overflow:hidden;margin-top:14px"><i style="display:block;height:100%;width:' + pct + '%;background:' + (darkOnLight ? '#3D2314' : '#fff') + ';border-radius:999px"></i></div></section>';

  /* Sidebar: supplements for this level + review. */
  document.getElementById('levelSide').innerHTML =
    '<section class="card"><h3>Supplements · ' + lv.name + '</h3>' +
    EE.supplementTypes().map(function (s) {
      return '<a class="side-link" href="supplement.html?type=' + encodeURIComponent(s.id) + '&level=' + key + '">' +
        '<span class="ic-tile" style="background:' + s.color + ';color:#fff;width:40px;height:40px;border-radius:12px">' + EE.icon(s.icon) + '</span>' +
        '<span>' + EE.esc(s.name) + '<small>' + EE.esc(s.perLevelLabel) + '</small></span></a>';
    }).join('') +
    '<p><a class="btn small" href="supplements.html">All supplements</a></p></section>' +
    '<section class="card"><h3>Review</h3><p class="muted">' + vc.done + ' of ' + total + ' days visited. Look back before you move on.</p>' +
    '<p><a class="btn ghost small" href="review.html">Open Review</a></p></section>';

  var list = document.getElementById('unitList');
  units.forEach(function (u) {
    var from = u.days[0], to = u.days[1];
    var done = 0;
    for (var d = from; d <= to; d++) if (EE.isVisited(key, d)) done++;
    var unitDays = to - from + 1;
    var card = document.createElement('section');
    card.className = 'card';
    card.style.setProperty('--level', lv.color);
    var lessons = '';
    var titles = {};
    if (data.unitLessons && data.unitLessons[key] && data.unitLessons[key][String(u.number)]) {
      data.unitLessons[key][String(u.number)].forEach(function (l) { titles[l.day] = l.title; });
    } else if (key === 'a1' && data.a1Lessons) {
      data.a1Lessons.forEach(function (l) { if (l.day >= from && l.day <= to) titles[l.day] = l.title; });
    }
    for (var day = from; day <= to; day++) {
      var v = EE.isVisited(key, day);
      var title = titles[day] || ('Day ' + day);
      lessons += '<a class="day-row' + (v ? ' done' : '') + '" href="day.html?level=' + key + '&day=' + day + '">' +
        '<span class="n">' + (v ? EE.icon('check') : day) + '</span>' +
        '<span class="t"><strong>Day ' + day + '</strong> — ' + EE.esc(title) + '</span>' +
        '<span class="visited-dot' + (v ? ' done' : '') + '"><span class="dot"></span>' + (v ? 'Visited' : 'Not visited') + '</span></a>';
    }
    card.innerHTML =
      '<div class="unit-head" style="--level:' + lv.color + '">' +
      '<span class="ring">' + EE.ring(done, unitDays, lv.color, 56) + '</span>' +
      '<div><h2 style="margin:0">Unit ' + u.number + ' — ' + EE.esc(u.title) + '</h2>' +
      '<p class="muted" style="margin:2px 0">Days ' + from + '–' + to + ' · ' + done + ' of ' + unitDays + ' visited</p></div></div>' +
      '<div>' + lessons + '</div>';
    list.appendChild(card);
  });
})();
</script>
